function takeB(k){const b=first(k);if(b)b.q--}
function edOf(k){const b=first(k);return b?b.ed:'-'}
function addB(k,q,ed){const b=ed?null:first(k);b?b.q+=q:bt()[k].push({q,ed:ed||day()+150})}
function recv(o){const n=S.up&&S.up.gud?30:20;S.stock[o.k]+=n;addB(o.k,n,day()+(o.sh||150))}

function labS(i,sel,n,e,o){const r=LAB[i];n=n||0;e=e||0;o=o||shuf(r.s);if(n==6)return labQ(i,sel,e);
